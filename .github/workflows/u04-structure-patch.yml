name: u04-structure-patch

on:
  push:
    branches:
      - feat/u04-structure-progressive-disclosure

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node dev/tools/patch-u04-structure.mjs
      - run: sed -i 's/\${ri}/\${i}/g' dev/tests/integration/viewer-structure-projection.test.mjs
      - run: npm ci
      - run: npm run check
      - name: Commit U04 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/repoaxis/viewer/viewer-0.js skills/repoaxis/viewer/viewer-1.js skills/repoaxis/viewer/viewer-4.js skills/repoaxis/viewer/repoaxis.html dev/tests/integration/viewer-structure-projection.test.mjs
          git commit -m "U04: restore progressive Structure exploration"
          git push origin HEAD:feat/u04-structure-progressive-disclosure
