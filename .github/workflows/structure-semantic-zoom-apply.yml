name: structure-semantic-zoom-apply
on:
  push:
    branches: [fix/structure-semantic-zoom]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: node dev/tools/apply-structure-semantic-zoom.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run release:dry-run
      - name: Commit product patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/repoaxis/viewer/repoaxis.html
          git commit -m 'Restore semantic zoom in Structure'
          git push origin HEAD:fix/structure-semantic-zoom
