name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.15.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: repoaxis-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    if: github.repository == 'ictseoyoungmin/repoaxis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Require existing release tag on main history
        run: |
          git fetch origin main --tags
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "$RELEASE_TAG" origin/main

      - run: npm ci
      - run: npm run check

      - name: Prepare release assets
        run: node dev/tools/prepare-release.mjs --tag "$RELEASE_TAG" --out dist/release

      - name: Publish npm package with trusted publishing
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          set +e
          PUBLISHED="$(npm view "${NAME}@${VERSION}" version --json 2>/dev/null)"
          VIEW_STATUS=$?
          set -e

          if [[ $VIEW_STATUS -eq 0 ]]; then
            if [[ "$PUBLISHED" == "\"${VERSION}\"" || "$PUBLISHED" == "$VERSION" ]]; then
              echo "${NAME}@${VERSION} is already published; skipping npm publish."
              exit 0
            fi
            echo "Unexpected npm registry response for ${NAME}@${VERSION}: $PUBLISHED" >&2
            exit 1
          fi

          if [[ "$PUBLISHED" == *'"code": "E404"'* || "$PUBLISHED" == *'"code":"E404"'* ]]; then
            echo "${NAME}@${VERSION} is not published yet; continuing with trusted publishing."
          else
            echo "Unable to determine npm publication state for ${NAME}@${VERSION}: $PUBLISHED" >&2
            exit 1
          fi

          npm publish "dist/release/repoaxis-${VERSION}.tgz" --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/release/repoaxis-*.tgz \
              dist/release/repoaxis-*.tgz.sha256 \
              dist/release/release-manifest.json \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/release/repoaxis-*.tgz \
              dist/release/repoaxis-*.tgz.sha256 \
              dist/release/release-manifest.json \
              --verify-tag \
              --title "Repoaxis $RELEASE_TAG" \
              --notes-file dist/release/release-notes.md
          fi
