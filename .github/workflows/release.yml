name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: repoaxis-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ictseoyoungmin/repoaxis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
            RELEASE_TAG="v${VERSION}"
            if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "${RELEASE_TAG} already exists; refusing bootstrap tag creation." >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Repoaxis ${RELEASE_TAG}"
            git push origin "$RELEASE_TAG"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Require release commit on main history
        run: |
          git fetch origin main --tags
          git merge-base --is-ancestor "$RELEASE_TAG" origin/main

      - run: npm ci
      - run: npm run check

      - name: Prepare release assets
        run: node dev/tools/prepare-release.mjs --tag "$RELEASE_TAG" --out dist/release

      - name: Publish npm package with trusted publishing
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          set +e
          PUBLISHED="$(npm view "${NAME}@${VERSION}" version --json 2>/dev/null)"
          VIEW_STATUS=$?
          set -e

          if [[ $VIEW_STATUS -eq 0 ]]; then
            if [[ "$PUBLISHED" == "\"${VERSION}\"" || "$PUBLISHED" == "$VERSION" ]]; then
              echo "${NAME}@${VERSION} is already published; skipping npm publish."
              exit 0
            fi
            echo "Unexpected npm registry response for ${NAME}@${VERSION}: $PUBLISHED" >&2
            exit 1
          fi

          if [[ "$PUBLISHED" == *'"code": "E404"'* || "$PUBLISHED" == *'"code":"E404"'* ]]; then
            echo "${NAME}@${VERSION} is not published yet; continuing with trusted publishing."
          else
            echo "Unable to determine npm publication state for ${NAME}@${VERSION}: $PUBLISHED" >&2
            exit 1
          fi

          npm publish "dist/release/repoaxis-${VERSION}.tgz" --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/release/repoaxis-*.tgz \
              dist/release/repoaxis-*.tgz.sha256 \
              dist/release/release-manifest.json \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/release/repoaxis-*.tgz \
              dist/release/repoaxis-*.tgz.sha256 \
              dist/release/release-manifest.json \
              --verify-tag \
              --title "Repoaxis $RELEASE_TAG" \
              --notes-file dist/release/release-notes.md
          fi
