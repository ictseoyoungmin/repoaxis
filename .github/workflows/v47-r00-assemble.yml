name: v47-r00-assemble
on:
  push:
    branches:
      - feat/v47-r00-canonical-viewer-reset
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Apply canonical reset
        run: python .v47-r00/apply.py
      - name: Validate reset
        run: |
          npm ci
          npm run check
          npm run release:dry-run
      - name: Commit canonical reset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'V47-R00: reset viewer to canonical single-file prototype'
          git push origin HEAD:feat/v47-r00-canonical-viewer-reset
