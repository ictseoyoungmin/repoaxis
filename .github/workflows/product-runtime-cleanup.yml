name: product-runtime-cleanup
on:
  push:
    branches:
      - refactor/product-runtime-cleanup
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: node dev/tools/prepare-cleanup-transform.mjs
      - run: node dev/tools/apply-product-runtime-cleanup.mjs
      - run: node dev/tools/check-product-viewer.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run release:dry-run
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/repoaxis/viewer/repoaxis.html dev/tests/integration/viewer.test.mjs
          git commit -m 'Refactor product viewer runtime boundaries'
          git push origin HEAD:refactor/product-runtime-cleanup
