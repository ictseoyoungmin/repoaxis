name: pr62-stale-anchor-cleanup

on:
  push:
    branches:
      - fix/structure-semantic-zoom

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/structure-semantic-zoom
          fetch-depth: 0
      - name: Remove stale ancestor-anchor implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('skills/repoaxis/viewer/repoaxis.html')
          text = path.read_text(encoding='utf-8')
          old = "function overviewSelectionAnchor(id){let n=byId[id];while(n&&!overviewPositions?.[n.id])n=n.parent?byId[n.parent]:null;return n?.id||null}"
          new = "function overviewSelectionAnchor(id){return id}"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale ancestor fallback, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/pr62-stale-anchor-cleanup.yml')
          workflow.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/repoaxis/viewer/repoaxis.html .github/workflows/pr62-stale-anchor-cleanup.yml
          git commit -m "fix: remove stale Structure ancestor anchor"
          git push origin HEAD:fix/structure-semantic-zoom
