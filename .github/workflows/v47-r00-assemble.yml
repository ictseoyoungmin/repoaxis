name: v47-r00-assemble
on:
  push:
    branches:
      - feat/v47-r00-canonical-viewer-reset
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Verify source segments
        run: |
          echo '84913532719b86b39e07d467ff67df17fa815f3ad5d9c4fe0c72c36c563764f6  .v47-r00/gz-00.b64' | sha256sum -c -
          echo '95189829d8bf2def5015bb01739eef2a0a9c471ea6d175f29404c1098fb6782a  .v47-r00/chunk-01.b64' | sha256sum -c -
          echo '9f1f32fe2ab413ae6cd91e212c1ced392dd641eb486a853ae8f3d5edd54711c1  .v47-r00/chunk-02.b64' | sha256sum -c -
          echo 'e1293ac9e312b1dda319e3d54f5087ddfede5b40132054b1bdaf17fc0160291d  .v47-r00/gz-00d.b64' | sha256sum -c -
          echo '51610d6d02eb01bd06b17502ba0a5e55afb813017fcc2295272d3fd3677682d3  .v47-r00/gz-01.b64' | sha256sum -c -
          echo 'a33d5defffdb7dc528b7dfa342ad383447cd804f672b59ccbebaf7e689fff12f  .v47-r00/gz-02.b64' | sha256sum -c -
          echo 'bb4e10520e7c7c71e0a2c020d07e3d3b695433aceddd28fd0ab2a1cf86730fa2  .v47-r00/gz-03.b64' | sha256sum -c -
          echo 'cdcecea6818c82ab6739f331a2225d52ec68f41b751df0fcb3823b095de9b36e  .v47-r00/gz-04.b64' | sha256sum -c -
      - name: Apply canonical reset
        run: |
          python -c "from pathlib import Path; p=Path('.v47-r00/apply.py'); s=p.read_text(); a=s.index('parts=['); b=s.index(chr(10)+'encoded=',a); line=\"parts=[ROOT/'.v47-r00/gz-00.b64',ROOT/'.v47-r00/chunk-01.b64',ROOT/'.v47-r00/chunk-02.b64',ROOT/'.v47-r00/gz-00d.b64',ROOT/'.v47-r00/gz-01.b64',ROOT/'.v47-r00/gz-02.b64',ROOT/'.v47-r00/gz-03.b64',ROOT/'.v47-r00/gz-04.b64']\"; p.write_text(s[:a]+line+s[b:])"
          python .v47-r00/apply.py
      - name: Validate reset
        run: |
          npm ci
          npm run check
          npm run release:dry-run
      - name: Commit canonical reset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'V47-R00: reset viewer to canonical single-file prototype'
          git push origin HEAD:feat/v47-r00-canonical-viewer-reset
