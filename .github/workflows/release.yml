name: release

on:
  push:
    branches:
      - main
    paths:
      - "dev/reports/p03-release-request.json"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: repoaxis-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ictseoyoungmin/repoaxis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          VERSION="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
          EXPECTED_TAG="v${VERSION}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
              echo "release tag $TAG does not match package version $EXPECTED_TAG" >&2
              exit 1
            fi
          else
            TAG="$EXPECTED_TAG"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "bootstrap tag already exists: $TAG" >&2
              exit 1
            fi
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Require release commit on main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - run: npm ci
      - run: npm run check

      - name: Prepare release assets
        run: node dev/tools/prepare-release.mjs --tag "${{ steps.release_meta.outputs.tag }}" --out dist/release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/release/repoaxis-*.tgz \
            dist/release/repoaxis-*.tgz.sha256 \
            dist/release/release-manifest.json \
            --verify-tag \
            --title "Repoaxis $RELEASE_TAG" \
            --notes-file dist/release/release-notes.md
