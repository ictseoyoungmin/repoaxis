name: u14-badge-padding-tune
on:
  push:
    branches: [feat/u14-graph-label-framing]
    paths: [.github/workflows/u14-badge-padding-tune.yml]
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: node dev/tools/tune-u14-badge-padding.mjs
      - run: npm run check
      - name: Commit tune
        run: |
          git config user.name 'ictseoyoungmin'
          git config user.email '90033184+ictseoyoungmin@users.noreply.github.com'
          git add skills/repoaxis/viewer/viewer-0.js dev/tests/integration/viewer-graph-framing.test.mjs
          git commit -m 'U14: add breathing room to Git badges'
          git push origin HEAD:feat/u14-graph-label-framing
