name: structure-overview-selection-anchor
on:
  push:
    branches:
      - feat/structure-whole-map-default
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: node dev/tools/harden-structure-overview-selection-anchor.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run release:dry-run
      - name: Commit product hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/repoaxis/viewer/repoaxis.html
          git commit -m 'Anchor nested Structure selections on the whole map'
          git push origin HEAD:feat/structure-whole-map-default
