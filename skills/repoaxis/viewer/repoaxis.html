<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Repoaxis</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#111419;--panel2:#151920;--line:#252b34;--text:#e8edf3;--muted:#8e98a7;--soft:#bac3cf;--accent:#85a7ff;--good:#6bd4a8;--warn:#e8bc65;--bad:#ef7f87;--violet:#b496ff;--shadow:0 18px 55px rgba(0,0,0,.25);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,rgba(71,99,155,.18),transparent 26rem),var(--bg);color:var(--text);min-height:100vh}button,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.top{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.top-inner{height:68px;padding:0 22px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:720;letter-spacing:-.02em}.axis{width:24px;height:24px;border:1px solid #566173;border-radius:7px;position:relative;background:linear-gradient(135deg,#1b2230,#11151b)}.axis:before,.axis:after{content:"";position:absolute;background:var(--accent)}.axis:before{left:5px;right:5px;top:11px;height:1px}.axis:after{top:5px;bottom:5px;left:11px;width:1px}.repo-meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;min-width:0}.chip{border:1px solid var(--line);background:#10141a;border-radius:999px;padding:5px 8px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}.live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 12px rgba(107,212,168,.45)}.workspace{display:grid;grid-template-columns:310px minmax(0,1fr) 330px;min-height:0;height:calc(100vh - 68px)}.side,.inspector{background:rgba(17,20,25,.82);min-height:0;overflow:auto}.side{border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line)}.side-head,.inspector-head{padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(17,20,25,.96);backdrop-filter:blur(12px);z-index:5}.search{width:100%;background:#0d1014;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;outline:none}.search:focus{border-color:#50689c;box-shadow:0 0 0 3px rgba(80,104,156,.14)}.stats{display:flex;gap:10px;margin-top:10px;color:var(--muted);font-size:11px}.tree{padding:8px 8px 30px}.row{display:flex;align-items:center;gap:7px;min-height:29px;padding:4px 7px;border-radius:7px;cursor:pointer;color:var(--soft);font-size:12px;white-space:nowrap}.row:hover{background:#171c23}.row.selected{background:#1d2635;color:#f4f7fb}.twisty{width:12px;color:#657083;text-align:center;flex:none}.kind{width:17px;text-align:center;color:#7e8da4;flex:none}.label{overflow:hidden;text-overflow:ellipsis}.badge{margin-left:5px;font-size:9px;padding:2px 5px;border-radius:999px;border:1px solid currentColor;opacity:.9}.badge:first-of-type{margin-left:auto}.b-modified,.b-added,.b-renamed,.b-copied,.b-type-changed{color:var(--warn)}.b-staged{color:var(--good)}.b-untracked{color:var(--violet)}.b-deleted,.b-conflicted{color:var(--bad)}.change-list{display:grid;gap:8px}.change-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(17,20,25,.72);font-size:12px}.change-row[data-id]{cursor:pointer}.change-row[data-id]:hover{background:#181d24}.change-path{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.change-tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.change-tag{font-size:9px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.change-tag.working{color:var(--warn);border-color:currentColor}.change-tag.staged{color:var(--good);border-color:currentColor}.change-tag.deleted,.change-tag.conflicted{color:var(--bad);border-color:currentColor}.change-tag.untracked{color:var(--violet);border-color:currentColor}.main{min-width:0;display:grid;grid-template-rows:auto 1fr;overflow:hidden}.tabs{height:50px;padding:0 18px;display:flex;align-items:end;gap:4px;border-bottom:1px solid var(--line);background:rgba(14,17,21,.72)}.tab{border:0;background:transparent;color:var(--muted);padding:14px 13px 11px;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--text);border-bottom-color:var(--accent)}.surface{overflow:auto;padding:20px}.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center}.hero{padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(140deg,rgba(31,38,49,.86),rgba(17,20,25,.7));box-shadow:var(--shadow);margin-bottom:16px}.eyebrow{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.hero h2{margin:7px 0 4px;font-size:20px;letter-spacing:-.02em}.hero code{color:#c9d7ff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid var(--line);background:rgba(17,20,25,.8);border-radius:13px;overflow:hidden}.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}.list{padding:7px}.dep{display:flex;gap:9px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;font-size:12px}.dep:hover{background:#181d24}.dep .arrow{color:#63718a}.dep .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rev-tree{padding:12px 14px}.rev-item{margin:4px 0;font-size:12px}.rev-line{display:flex;gap:8px;align-items:center;cursor:pointer;padding:5px;border-radius:6px}.rev-line:hover{background:#181d24}.cycle{color:var(--warn);font-size:10px}.graph-wrap{height:calc(100vh - 158px);min-height:480px;position:relative;border:1px solid var(--line);border-radius:14px;background:radial-gradient(circle at center,rgba(45,54,69,.22),transparent 45%),#0e1115;overflow:hidden}.graph-wrap svg{width:100%;height:100%;display:block}.edge{stroke:#39424f;stroke-width:1;fill:none;opacity:.72}.edge.in{stroke:#6f8bd2}.node rect{fill:#161b22;stroke:#39424f;rx:7}.node text{fill:#cbd4df;font-size:10px;pointer-events:none}.node.selected rect{stroke:var(--accent);stroke-width:2;fill:#192335}.node.changed rect{stroke:#a98749}.node{cursor:pointer}.graph-note{position:absolute;left:12px;bottom:12px;background:rgba(11,13,16,.82);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--muted);font-size:10px}.inspector-body{padding:14px}.section{margin-bottom:20px}.section-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}.kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:7px 10px;font-size:11px}.k{color:var(--muted)}.v{color:var(--soft);overflow-wrap:anywhere}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.signature{padding:10px;border:1px solid var(--line);border-radius:8px;background:#0d1014;color:#c8d7ff;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.note{padding:10px;border-left:2px solid var(--violet);background:rgba(180,150,255,.07);font-size:11px;line-height:1.55;color:#d7c9ff}.status-pill{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:10px}.commit{font-size:11px;line-height:1.5}.commit .subject{color:var(--text)}.commit .meta{color:var(--muted);margin-top:3px}.error-banner{position:fixed;right:18px;bottom:18px;max-width:430px;background:#321a1d;border:1px solid #6b3037;color:#ffced2;border-radius:10px;padding:11px 13px;font-size:12px;box-shadow:var(--shadow);z-index:50}[hidden]{display:none!important}@media(max-width:1000px){.workspace{grid-template-columns:270px minmax(0,1fr)}.inspector{display:none}}@media(max-width:720px){.workspace{display:block;height:auto}.side{height:38vh;border-right:0;border-bottom:1px solid var(--line)}.main{height:62vh}.repo-meta{display:none}.grid2{grid-template-columns:1fr}.surface{padding:12px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="top-inner"><div class="brand"><span class="axis"></span>Repoaxis</div><div class="repo-meta"><span class="chip" id="ref">—</span><span class="chip mono" id="head">—</span></div><div class="live"><span class="dot"></span><span id="liveText">Connecting…</span></div></div></header>
<div class="workspace">
<aside class="side"><div class="side-head"><input class="search" id="search" placeholder="Filter paths or symbols…" autocomplete="off"><div class="stats"><span id="nodeStat">0 nodes</span><span id="edgeStat">0 edges</span><span id="changeStat">0 changes</span></div></div><div class="tree" id="tree"></div></aside>
<main class="main"><nav class="tabs"><button class="tab active" data-tab="structure">Structure</button><button class="tab" data-tab="dependencies">Dependencies</button><button class="tab" data-tab="changes">Changes</button><button class="tab" data-tab="graph">Graph</button></nav><section class="surface" id="surface"></section></main>
<aside class="inspector"><div class="inspector-head"><div class="eyebrow">Inspector</div><div id="inspectTitle" style="margin-top:5px;font-size:13px">Select a node</div></div><div class="inspector-body" id="inspector"></div></aside>
</div></div><div class="error-banner" id="error" hidden></div>
<script>
const $=s=>document.querySelector(s);const initialTab=['structure','dependencies','changes','graph'].includes(location.hash.slice(1))?location.hash.slice(1):'structure';const state={index:null,selected:null,tab:initialTab,query:'',fingerprint:null,collapsed:new Set()};
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nodes=()=>state.index?.generated?.nodes||{};const edges=()=>state.index?.generated?.edges||[];const changes=()=>state.index?.generated?.git_changes||[];
const node=id=>nodes()[id]||null;const children=id=>edges().filter(e=>e.type==='contains'&&e.from===id).map(e=>node(e.to)).filter(Boolean).sort(sortNode);
function sortNode(a,b){const rank={folder:0,file:1,class:2,function:3};return (rank[a.type]-rank[b.type])||a.path.localeCompare(b.path)||(a.qualified_name||'').localeCompare(b.qualified_name||'')}
function icon(n){return n.type==='folder'?'▾':n.type==='file'?'◇':n.type==='class'?'C':'ƒ'}
function display(n){if(n.type==='folder')return n.path==='.'?'repository':n.path.split('/').at(-1);if(n.type==='file')return n.path.split('/').at(-1);return n.qualified_name||n.path}
function gitBadge(n){if(n.type!=='file'||!n.git)return'';const out=[];if(n.git.conflicted)out.push('<span class="badge b-conflicted">conflicted</span>');if(n.git.working&&n.git.working!=='clean')out.push(`<span class="badge b-${h(n.git.working)}">${h(n.git.working)}</span>`);if(n.git.staged)out.push(`<span class="badge b-staged">staged ${h(n.git.staged)}</span>`);return out.join('')}
function matches(n){if(!state.query)return true;const q=state.query.toLowerCase();return [n.id,n.path,n.qualified_name].filter(Boolean).some(v=>v.toLowerCase().includes(q))}
function subtreeMatches(id){const n=node(id);if(!n)return false;if(matches(n))return true;return children(id).some(c=>subtreeMatches(c.id))}
function renderTree(){const root=node('folder:.');if(!root){$('#tree').innerHTML='<div class="empty">No canonical root.</div>';return}let out='';function walk(n,depth){if(!subtreeMatches(n.id))return;const kids=children(n.id),coll=state.collapsed.has(n.id);out+=`<div class="row ${state.selected===n.id?'selected':''}" data-id="${h(n.id)}" style="padding-left:${7+depth*13}px"><span class="twisty" data-toggle="${h(n.id)}">${kids.length?(coll?'›':'⌄'):''}</span><span class="kind">${icon(n)}</span><span class="label">${h(display(n))}</span>${gitBadge(n)}</div>`;if(!coll)kids.forEach(c=>walk(c,depth+1))}walk(root,0);$('#tree').innerHTML=out||'<div class="empty">No matches.</div>'}
function containingFile(n){if(!n)return null;if(n.type==='file')return n;let cur=n;const seen=new Set();while(cur?.parent_id&&!seen.has(cur.id)){seen.add(cur.id);cur=node(cur.parent_id);if(cur?.type==='file')return cur}return nodes()[`file:${n.path}`]||null}
function importsOf(fileId){return edges().filter(e=>e.type==='imports'&&e.from===fileId).map(e=>node(e.to)).filter(Boolean).sort(sortNode)}function importedBy(fileId){return edges().filter(e=>e.type==='imports'&&e.to===fileId).map(e=>node(e.from)).filter(Boolean).sort(sortNode)}
function select(id){if(!node(id))return;state.selected=id;renderAll()}
function renderStructure(){const n=node(state.selected)||node('folder:.');if(!n){$('#surface').innerHTML='<div class="empty">No node selected.</div>';return}const file=containingFile(n);const outs=file?importsOf(file.id):[],ins=file?importedBy(file.id):[];$('#surface').innerHTML=`<div class="hero"><div class="eyebrow">${h(n.type)} · ${h(n.path)}</div><h2>${h(display(n))}</h2>${n.source?.signature?`<code>${h(n.source.signature)}</code>`:''}</div><div class="grid2"><div class="card"><h3>Contains</h3><div class="list">${children(n.id).map(depRow).join('')||'<div class="dep" style="color:var(--muted)">No direct children</div>'}</div></div><div class="card"><h3>File relationships</h3><div class="list">${file?`<div class="dep" style="color:var(--muted)">${outs.length} imports · ${ins.length} imported by</div>`:'<div class="dep" style="color:var(--muted)">Select a file or symbol</div>'}</div></div></div>`}
function depRow(n,prefix=''){return`<div class="dep" data-id="${h(n.id)}"><span class="arrow">${prefix||icon(n)}</span><span class="path">${h(n.qualified_name||n.path)}</span></div>`}
function reverseTree(fileId,maxDepth=5){const seen=new Set();function walk(id,depth){const n=node(id);if(!n)return'';const parents=importedBy(id);const cycle=seen.has(id);if(cycle)return`<div class="rev-item" style="margin-left:${depth*14}px"><span class="cycle">cycle · ${h(n.path)}</span></div>`;seen.add(id);let html=`<div class="rev-item" style="margin-left:${depth*14}px"><div class="rev-line" data-id="${h(id)}"><span class="arrow">${depth?'↳':'●'}</span><span>${h(n.path)}</span></div></div>`;if(depth<maxDepth)for(const p of parents)html+=walk(p.id,depth+1);seen.delete(id);return html}return walk(fileId,0)}
function renderDependencies(){const n=node(state.selected)||node('folder:.');const file=containingFile(n);if(!file){$('#surface').innerHTML='<div class="empty">Select a file or symbol to inspect dependencies.</div>';return}const outs=importsOf(file.id),ins=importedBy(file.id);$('#surface').innerHTML=`<div class="hero"><div class="eyebrow">Dependency focus</div><h2>${h(file.path)}</h2><div style="color:var(--muted);font-size:12px">${outs.length} outgoing · ${ins.length} incoming canonical imports</div></div><div class="grid2"><div class="card"><h3>Imports</h3><div class="list">${outs.map(n=>depRow(n,'→')).join('')||'<div class="dep" style="color:var(--muted)">No repository-local imports</div>'}</div></div><div class="card"><h3>Imported by</h3><div class="list">${ins.map(n=>depRow(n,'←')).join('')||'<div class="dep" style="color:var(--muted)">No incoming imports</div>'}</div></div></div><div class="card" style="margin-top:14px"><h3>Reverse dependency tree · depth 5</h3><div class="rev-tree">${reverseTree(file.id)}</div></div>`}
function changeTags(c){const tags=[];if(c.conflicted)tags.push('<span class="change-tag conflicted">conflicted</span>');if(c.working&&c.working!=='clean')tags.push(`<span class="change-tag working ${h(c.working)}">working ${h(c.working)}</span>`);if(c.staged)tags.push(`<span class="change-tag staged">staged ${h(c.staged)}</span>`);return tags.join('')}
function renderChanges(){const items=changes();if(!items.length){$('#surface').innerHTML='<div class="hero"><div class="eyebrow">Working tree</div><h2>No changes</h2><div style="color:var(--muted);font-size:12px">The indexed Git working tree is clean.</div></div>';return}$('#surface').innerHTML=`<div class="hero"><div class="eyebrow">Working tree</div><h2>${items.length} changed path${items.length===1?'':'s'}</h2><div style="color:var(--muted);font-size:12px">Includes staged, unstaged, untracked, conflicted, and deleted paths. Deleted paths remain visible even when no current node exists.</div></div><div class="change-list">${items.map(c=>`<div class="change-row" ${c.node_id?`data-id="${h(c.node_id)}"`:''}><span class="kind">${c.node_id?'◇':'×'}</span><span class="change-path mono">${h(c.path)}</span><span class="change-tags">${changeTags(c)}</span></div>`).join('')}</div>`}
function graphScope(){const files=Object.values(nodes()).filter(n=>n.type==='file').sort(sortNode);if(files.length<=80)return files;const focus=containingFile(node(state.selected));if(!focus)return files.slice(0,80);const keep=new Map([[focus.id,focus]]),front=[focus];for(let depth=0;depth<3&&front.length&&keep.size<80;depth++){const batch=front.splice(0);for(const f of batch){for(const x of [...importsOf(f.id),...importedBy(f.id)])if(!keep.has(x.id)&&keep.size<80){keep.set(x.id,x);front.push(x)}}}return [...keep.values()].sort(sortNode)}
function renderGraph(){const scope=graphScope(),ids=new Set(scope.map(n=>n.id)),ies=edges().filter(e=>e.type==='imports'&&ids.has(e.from)&&ids.has(e.to));const cols=Math.max(1,Math.ceil(Math.sqrt(scope.length*1.6))),cellW=170,cellH=72,w=Math.max(700,cols*cellW+80),rows=Math.ceil(scope.length/cols),hh=Math.max(480,rows*cellH+80);const pos=new Map();scope.forEach((n,i)=>pos.set(n.id,{x:50+(i%cols)*cellW,y:50+Math.floor(i/cols)*cellH}));let svg=`<svg viewBox="0 0 ${w} ${hh}" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4c596b"/></marker></defs>`;for(const e of ies){const a=pos.get(e.from),b=pos.get(e.to);svg+=`<path class="edge" marker-end="url(#arr)" d="M ${a.x+118} ${a.y+16} C ${(a.x+b.x)/2+60} ${a.y+16}, ${(a.x+b.x)/2+60} ${b.y+16}, ${b.x} ${b.y+16}"/>`}for(const n of scope){const p=pos.get(n.id),sel=containingFile(node(state.selected))?.id===n.id,changed=n.git&&(n.git.working!=='clean'||n.git.staged);svg+=`<g class="node ${sel?'selected':''} ${changed?'changed':''}" data-id="${h(n.id)}" transform="translate(${p.x},${p.y})"><rect width="118" height="32"></rect><text x="9" y="20">${h(n.path.split('/').at(-1).slice(0,17))}</text></g>`}svg+='</svg>';$('#surface').innerHTML=`<div class="graph-wrap">${svg}<div class="graph-note">${scope.length} files · ${ies.length} import edges${Object.values(nodes()).filter(n=>n.type==='file').length>80?' · focused/bounded view':''}</div></div>`}
function renderInspector(){const n=node(state.selected);if(!n){$('#inspectTitle').textContent='Select a node';$('#inspector').innerHTML='<div class="empty" style="height:200px">Structure, Git context and annotations appear here.</div>';return}$('#inspectTitle').textContent=display(n);const f=containingFile(n),g=f?.git,ann=state.index.annotations?.[n.id]||state.index.annotations?.[f?.id];let html=`<div class="section"><div class="section-title">Identity</div><div class="kv"><div class="k">Type</div><div class="v">${h(n.type)}</div><div class="k">Path</div><div class="v mono">${h(n.path)}</div><div class="k">Node ID</div><div class="v mono">${h(n.id)}</div></div></div>`;if(n.source)html+=`<div class="section"><div class="section-title">Source</div><div class="signature">${h(n.source.signature)}</div><div class="kv" style="margin-top:8px"><div class="k">Range</div><div class="v">L${n.source.start_line}:${n.source.start_column}–L${n.source.end_line}:${n.source.end_column}</div></div></div>`;if(g){html+=`<div class="section"><div class="section-title">Git</div><div class="status-pill">${h(g.working)}${g.staged?` · staged ${h(g.staged)}`:''}</div>${g.last_commit?`<div class="commit" style="margin-top:10px"><div class="subject">${h(g.last_commit.subject)}</div><div class="meta mono">${h(g.last_commit.sha.slice(0,10))}</div><div class="meta">${h(g.last_commit.author_name)} · ${h(g.last_commit.committed_at)}</div></div>`:''}</div>`}if(ann?.agent_note)html+=`<div class="section"><div class="section-title">Annotation</div><div class="note">${h(ann.agent_note)}</div></div>`;if(f)html+=`<div class="section"><div class="section-title">Dependencies</div><div class="kv"><div class="k">Imports</div><div class="v">${importsOf(f.id).length}</div><div class="k">Imported by</div><div class="v">${importedBy(f.id).length}</div></div></div>`;$('#inspector').innerHTML=html}
function renderAll(){renderTree();if(state.tab==='structure')renderStructure();else if(state.tab==='dependencies')renderDependencies();else if(state.tab==='changes')renderChanges();else renderGraph();renderInspector();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab))}
async function refresh(){try{const r=await fetch('/api/index',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);const fp=d.index.generated?.refresh?.fingerprint||d.index.repository?.head_sha||Math.random();const changed=fp!==state.fingerprint;state.index=d.index;state.fingerprint=fp;if(!state.selected||!node(state.selected))state.selected=node('folder:.')?.id||Object.keys(nodes())[0]||null;$('#ref').textContent=d.index.repository?.head_ref||'detached';$('#head').textContent=(d.index.repository?.head_sha||'unborn').slice(0,10);$('#nodeStat').textContent=`${Object.keys(nodes()).length} nodes`;$('#edgeStat').textContent=`${edges().length} edges`;$('#changeStat').textContent=`${d.index.generated?.git_changes?.length||0} changes`;$('#liveText').textContent=d.refreshed?`Refreshed · ${d.reason}`:'Live · fresh';if(changed)renderAll();$('#error').hidden=true}catch(e){$('#liveText').textContent='Disconnected';$('#error').textContent=`Viewer update failed: ${e.message}`;$('#error').hidden=false}}
$('#tree').addEventListener('click',e=>{const t=e.target.closest('[data-toggle]');if(t){const id=t.dataset.toggle;state.collapsed.has(id)?state.collapsed.delete(id):state.collapsed.add(id);renderTree();return}const r=e.target.closest('[data-id]');if(r)select(r.dataset.id)});$('#surface').addEventListener('click',e=>{const x=e.target.closest('[data-id]');if(x)select(x.dataset.id)});$('#search').addEventListener('input',e=>{state.query=e.target.value.trim();renderTree()});document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{state.tab=t.dataset.tab;history.replaceState(null,'',`#${state.tab}`);renderAll()}));window.addEventListener('hashchange',()=>{const tab=location.hash.slice(1);if(['structure','dependencies','changes','graph'].includes(tab)){state.tab=tab;renderAll()}});
refresh();setInterval(refresh,2500);
</script>
</body>
</html>
