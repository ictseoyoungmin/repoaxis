name: product-runtime-browser-qa
on:
  push:
    branches:
      - refactor/product-runtime-cleanup
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node dev/tools/product-runtime-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-runtime-browser-qa
          path: dev/visuals/product-runtime-browser-qa
          if-no-files-found: warn
