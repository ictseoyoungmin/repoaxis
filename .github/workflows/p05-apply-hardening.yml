name: p05-apply-hardening

on:
  push:
    branches:
      - feat/p05-registry-dogfood
    paths:
      - 'dev/reports/p05-hardening-request.md'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/p05-registry-dogfood

      - name: Apply viewer hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('skills/repoaxis/viewer/repoaxis.html')
          s=p.read_text()
          s=s.replace('.badge{margin-left:auto;font-size:9px;padding:2px 5px;border-radius:999px;border:1px solid currentColor;opacity:.9}.b-modified,.b-added,.b-renamed,.b-copied,.b-type-changed{color:var(--warn)}.b-untracked{color:var(--violet)}.b-deleted,.b-conflicted{color:var(--bad)}', '.badge{margin-left:5px;font-size:9px;padding:2px 5px;border-radius:999px;border:1px solid currentColor;opacity:.9}.badge:first-of-type{margin-left:auto}.b-modified,.b-added,.b-renamed,.b-copied,.b-type-changed{color:var(--warn)}.b-staged{color:var(--good)}.b-untracked{color:var(--violet)}.b-deleted,.b-conflicted{color:var(--bad)}.change-list{display:grid;gap:8px}.change-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(17,20,25,.72);font-size:12px}.change-row[data-id]{cursor:pointer}.change-row[data-id]:hover{background:#181d24}.change-path{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.change-tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.change-tag{font-size:9px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.change-tag.working{color:var(--warn);border-color:currentColor}.change-tag.staged{color:var(--good);border-color:currentColor}.change-tag.deleted,.change-tag.conflicted{color:var(--bad);border-color:currentColor}.change-tag.untracked{color:var(--violet);border-color:currentColor}')
          s=s.replace('<button class="tab" data-tab="dependencies">Dependencies</button><button class="tab" data-tab="graph">Graph</button>', '<button class="tab" data-tab="dependencies">Dependencies</button><button class="tab" data-tab="changes">Changes</button><button class="tab" data-tab="graph">Graph</button>')
          s=s.replace("const $=s=>document.querySelector(s);const state={index:null,selected:null,tab:'structure',query:'',fingerprint:null,collapsed:new Set()};", "const $=s=>document.querySelector(s);const initialTab=['structure','dependencies','changes','graph'].includes(location.hash.slice(1))?location.hash.slice(1):'structure';const state={index:null,selected:null,tab:initialTab,query:'',fingerprint:null,collapsed:new Set()};")
          s=s.replace("const nodes=()=>state.index?.generated?.nodes||{};const edges=()=>state.index?.generated?.edges||[];", "const nodes=()=>state.index?.generated?.nodes||{};const edges=()=>state.index?.generated?.edges||[];const changes=()=>state.index?.generated?.git_changes||[];")
          old="function gitBadge(n){if(n.type!=='file'||!n.git)return'';const s=n.git.conflicted?'conflicted':n.git.working!=='clean'?n.git.working:n.git.staged||'';return s?`<span class=\"badge b-${h(s)}\">${h(s)}</span>`:''}"
          new="function gitBadge(n){if(n.type!=='file'||!n.git)return'';const out=[];if(n.git.conflicted)out.push('<span class=\"badge b-conflicted\">conflicted</span>');if(n.git.working&&n.git.working!=='clean')out.push(`<span class=\"badge b-${h(n.git.working)}\">${h(n.git.working)}</span>`);if(n.git.staged)out.push(`<span class=\"badge b-staged\">staged ${h(n.git.staged)}</span>`);return out.join('')}"
          if old not in s: raise SystemExit('gitBadge contract changed')
          s=s.replace(old,new)
          needle="function renderDependencies(){const n=node(state.selected)||node('folder:.');const file=containingFile(n);if(!file){$('#surface').innerHTML='<div class=\"empty\">Select a file or symbol to inspect dependencies.</div>';return}const outs=importsOf(file.id),ins=importedBy(file.id);$('#surface').innerHTML=`<div class=\"hero\"><div class=\"eyebrow\">Dependency focus</div><h2>${h(file.path)}</h2><div style=\"color:var(--muted);font-size:12px\">${outs.length} outgoing · ${ins.length} incoming canonical imports</div></div><div class=\"grid2\"><div class=\"card\"><h3>Imports</h3><div class=\"list\">${outs.map(n=>depRow(n,'→')).join('')||'<div class=\"dep\" style=\"color:var(--muted)\">No repository-local imports</div>'}</div></div><div class=\"card\"><h3>Imported by</h3><div class=\"list\">${ins.map(n=>depRow(n,'←')).join('')||'<div class=\"dep\" style=\"color:var(--muted)\">No incoming imports</div>'}</div></div></div><div class=\"card\" style=\"margin-top:14px\"><h3>Reverse dependency tree · depth 5</h3><div class=\"rev-tree\">${reverseTree(file.id)}</div></div>`}"
          extra="\nfunction changeTags(c){const tags=[];if(c.conflicted)tags.push('<span class=\"change-tag conflicted\">conflicted</span>');if(c.working&&c.working!=='clean')tags.push(`<span class=\"change-tag working ${h(c.working)}\">working ${h(c.working)}</span>`);if(c.staged)tags.push(`<span class=\"change-tag staged\">staged ${h(c.staged)}</span>`);return tags.join('')}\nfunction renderChanges(){const items=changes();if(!items.length){$('#surface').innerHTML='<div class=\"hero\"><div class=\"eyebrow\">Working tree</div><h2>No changes</h2><div style=\"color:var(--muted);font-size:12px\">The indexed Git working tree is clean.</div></div>';return}$('#surface').innerHTML=`<div class=\"hero\"><div class=\"eyebrow\">Working tree</div><h2>${items.length} changed path${items.length===1?'':'s'}</h2><div style=\"color:var(--muted);font-size:12px\">Includes staged, unstaged, untracked, conflicted, and deleted paths. Deleted paths remain visible even when no current node exists.</div></div><div class=\"change-list\">${items.map(c=>`<div class=\"change-row\" ${c.node_id?`data-id=\"${h(c.node_id)}\"`:''}><span class=\"kind\">${c.node_id?'◇':'×'}</span><span class=\"change-path mono\">${h(c.path)}</span><span class=\"change-tags\">${changeTags(c)}</span></div>`).join('')}</div>`}"
          if needle not in s: raise SystemExit('dependency renderer contract changed')
          s=s.replace(needle,needle+extra)
          old="function renderAll(){renderTree();if(state.tab==='structure')renderStructure();else if(state.tab==='dependencies')renderDependencies();else renderGraph();renderInspector();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab))}"
          new="function renderAll(){renderTree();if(state.tab==='structure')renderStructure();else if(state.tab==='dependencies')renderDependencies();else if(state.tab==='changes')renderChanges();else renderGraph();renderInspector();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab))}"
          if old not in s: raise SystemExit('renderAll contract changed')
          s=s.replace(old,new)
          old="document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{state.tab=t.dataset.tab;renderAll()}));"
          new="document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{state.tab=t.dataset.tab;history.replaceState(null,'',`#${state.tab}`);renderAll()}));window.addEventListener('hashchange',()=>{const tab=location.hash.slice(1);if(['structure','dependencies','changes','graph'].includes(tab)){state.tab=tab;renderAll()}});"
          if old not in s: raise SystemExit('tab listener contract changed')
          s=s.replace(old,new)
          p.write_text(s)

          t=Path('dev/tests/integration/viewer.test.mjs')
          q=t.read_text()
          q=q.replace('    assert.match(html, /data-tab="dependencies"/);\n    assert.match(html, /data-tab="graph"/);', '    assert.match(html, /data-tab="dependencies"/);\n    assert.match(html, /data-tab="changes"/);\n    assert.match(html, /generated\\?\\.git_changes/);\n    assert.match(html, /staged \\$\\{h\\(n\\.git\\.staged\\)\\}/);\n    assert.match(html, /data-tab="graph"/);')
          t.write_text(q)
          PY

      - name: Remove applicator and commit
        run: |
          rm -f .github/workflows/p05-apply-hardening.yml dev/reports/p05-hardening-request.md
          git config user.name 'repoaxis-p05-bot'
          git config user.email '90033184+ictseoyoungmin@users.noreply.github.com'
          git add skills/repoaxis/viewer/repoaxis.html dev/tests/integration/viewer.test.mjs .github/workflows/p05-apply-hardening.yml dev/reports/p05-hardening-request.md
          git commit -m 'P05: surface complete Git changes in viewer'
          git push origin HEAD:feat/p05-registry-dogfood
