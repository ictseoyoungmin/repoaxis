name: p05-registry-dogfood

on:
  push:
    branches:
      - feat/p05-registry-dogfood
    paths:
      - '.github/workflows/p05-registry-dogfood.yml'
      - 'dev/reports/p05-dogfood-request.md'

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify public registry package
        run: |
          set -euo pipefail
          mkdir -p /tmp/p05-out
          npm view repoaxis@0.12.1 name version dist.integrity dist.shasum repository.url --json \
            | tee /tmp/p05-out/registry.json
          test "$(npm view repoaxis@0.12.1 version)" = "0.12.1"

      - name: Build clean external fixture repository
        run: |
          set -euo pipefail
          ROOT=/tmp/p05-external
          rm -rf "$ROOT"
          mkdir -p "$ROOT/src" "$ROOT/test"
          cd "$ROOT"

          cat > package.json <<'JSON'
          {
            "name": "repoaxis-p05-external-fixture",
            "private": true,
            "type": "module",
            "scripts": {"start": "node src/cli.js"}
          }
          JSON

          cat > src/cli.js <<'JS'
          import { loadConfig } from './config.js';
          import { startService } from './service.js';
          const config = loadConfig(process.env.APP_MODE ?? 'dev');
          startService(config);
          JS

          cat > src/config.js <<'JS'
          import { normalizeMode } from './utils.js';
          export function parseConfig(raw) {
            return { mode: normalizeMode(raw), retries: 2 };
          }
          export function loadConfig(raw) {
            return parseConfig(raw);
          }
          JS

          cat > src/service.js <<'JS'
          import { formatStatus } from './status.js';
          export function startService(config) {
            return formatStatus(config.mode);
          }
          JS

          cat > src/status.js <<'JS'
          import { normalizeMode } from './utils.js';
          export function formatStatus(mode) {
            return `service:${normalizeMode(mode)}`;
          }
          JS

          cat > src/utils.js <<'JS'
          export function normalizeMode(value) {
            return String(value).trim().toLowerCase();
          }
          JS

          cat > src/worker.js <<'JS'
          import { loadConfig } from './config.js';
          export function runWorker(input) {
            return loadConfig(input);
          }
          JS

          cat > src/unused-tool.js <<'JS'
          export function maintenanceTool() {
            return 'manual-entry';
          }
          JS

          cat > test/config.test.js <<'JS'
          import { strict as assert } from 'node:assert';
          import { parseConfig } from '../src/config.js';
          assert.equal(parseConfig(' PROD ').mode, 'prod');
          JS

          git init -b main
          git config user.name 'Repoaxis P05 Dogfood'
          git config user.email 'repoaxis-p05@example.invalid'
          git add .
          git commit -m 'fixture baseline'

      - name: Run public npm CLI end to end
        run: |
          set -euo pipefail
          ROOT=/tmp/p05-external
          OUT=/tmp/p05-out
          cd "$ROOT"

          npx -y repoaxis@0.12.1 version | tee "$OUT/version.txt"
          grep -q '0.12.1' "$OUT/version.txt"
          npx -y repoaxis@0.12.1 doctor > "$OUT/doctor.json"
          npx -y repoaxis@0.12.1 build > "$OUT/build.json"
          npx -y repoaxis@0.12.1 summary > "$OUT/summary.json"
          npx -y repoaxis@0.12.1 find parseConfig > "$OUT/find-parseConfig.json"
          npx -y repoaxis@0.12.1 context parseConfig > "$OUT/context-before.json"
          npx -y repoaxis@0.12.1 why parseConfig > "$OUT/why-parseConfig.json"
          npx -y repoaxis@0.12.1 unreferenced > "$OUT/unreferenced-before.json"
          npx -y repoaxis@0.12.1 note parseConfig 'P05 registry dogfood: config boundary.' > "$OUT/note-write.json"

          test -f .repoaxis.json
          test -f .git/repoaxis/annotations.json
          grep -q 'P05 registry dogfood' .git/repoaxis/annotations.json

          printf '\n// modified after baseline\n' >> src/config.js
          printf '\n// staged after baseline\n' >> src/service.js
          git add src/service.js
          cat > src/untracked.js <<'JS'
          export const untrackedFeature = true;
          JS
          git rm src/unused-tool.js

          npx -y repoaxis@0.12.1 changed > "$OUT/changed.json"
          npx -y repoaxis@0.12.1 context parseConfig > "$OUT/context-after-changes.json"

          rm .repoaxis.json
          test ! -f .repoaxis.json
          npx -y repoaxis@0.12.1 context parseConfig > "$OUT/context-after-index-delete.json"
          test -f .repoaxis.json
          grep -q 'P05 registry dogfood' "$OUT/context-after-index-delete.json"

          node - <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('.repoaxis.json', 'utf8'));
          const nodes = Object.values(index.generated?.nodes ?? index.nodes ?? {});
          if (!nodes.some(n => n.id === 'function:src/config.js::parseConfig')) {
            throw new Error('parseConfig node missing from rebuilt public-registry index');
          }
          const changes = index.generated?.git_changes ?? [];
          const text = JSON.stringify(changes);
          for (const expected of ['src/config.js', 'src/service.js', 'src/untracked.js', 'src/unused-tool.js']) {
            if (!text.includes(expected)) throw new Error(`missing Git change projection: ${expected}`);
          }
          fs.copyFileSync('.repoaxis.json', '/tmp/p05-out/index.json');
          NODE

      - name: Capture real human viewer
        run: |
          set -euo pipefail
          ROOT=/tmp/p05-external
          OUT=/tmp/p05-out
          cd "$ROOT"

          npx -y repoaxis@0.12.1 view --no-open --port 4317 > "$OUT/viewer.log" 2>&1 &
          VIEW_PID=$!
          trap 'kill "$VIEW_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4317/ > "$OUT/viewer-live.html"; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4317/api/index > "$OUT/viewer-index.json"

          BROWSER=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then BROWSER="$candidate"; break; fi
          done
          if [[ -z "$BROWSER" ]]; then
            echo 'No headless browser found on runner' >&2
            exit 1
          fi

          "$BROWSER" --headless=new --no-sandbox --disable-gpu \
            --window-size=1600,1000 --virtual-time-budget=2500 \
            --screenshot="$OUT/repoaxis-viewer.png" http://127.0.0.1:4317/

          "$BROWSER" --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=2500 --dump-dom http://127.0.0.1:4317/ \
            > "$OUT/repoaxis-viewer-rendered.html"

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('/tmp/p05-out/repoaxis-viewer-rendered.html')
          html = p.read_text(encoding='utf-8')
          html = re.sub(r'<script\b[^>]*>.*?</script>', '', html, flags=re.I|re.S)
          html = html.replace('</body>', '<div style="position:fixed;right:16px;bottom:12px;padding:7px 10px;border-radius:8px;background:#111827;color:#e5e7eb;font:12px system-ui;opacity:.88">Static P05 snapshot · public npm repoaxis@0.12.1</div></body>')
          Path('/tmp/p05-out/repoaxis-viewer-snapshot.html').write_text(html, encoding='utf-8')
          PY

          test -s "$OUT/repoaxis-viewer.png"
          test -s "$OUT/repoaxis-viewer-snapshot.html"

      - name: Write dogfood report
        run: |
          set -euo pipefail
          cd /tmp/p05-external
          node - <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('.repoaxis.json', 'utf8'));
          const nodes = Object.values(index.generated?.nodes ?? index.nodes ?? {});
          const edges = index.generated?.edges ?? index.edges ?? [];
          const changes = index.generated?.git_changes ?? [];
          const annotations = index.annotations ?? {};
          const report = [
            '# Repoaxis P05 registry dogfood',
            '',
            '- Source: public npm registry `repoaxis@0.12.1` via `npx -y` only.',
            '- Fixture: clean temporary Git repository; no Repoaxis checkout used by CLI.',
            `- Indexed nodes: ${nodes.length}`,
            `- Canonical edges: ${edges.length}`,
            `- Git change records after mutation: ${changes.length}`,
            `- Durable annotations: ${Object.keys(annotations).length}`,
            '- Verified: doctor, build, summary, find, context, why, unreferenced, note, query-time refresh, index deletion recovery, viewer API.',
            '- Visual evidence: `repoaxis-viewer.png` and `repoaxis-viewer-snapshot.html`.',
            ''
          ].join('\n');
          fs.writeFileSync('/tmp/p05-out/report.md', report);
          console.log(report);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: repoaxis-p05-registry-dogfood
          path: /tmp/p05-out
          if-no-files-found: error
          retention-days: 7
