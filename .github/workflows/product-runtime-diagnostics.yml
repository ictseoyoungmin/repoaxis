name: product-runtime-diagnostics
on:
  push:
    branches:
      - refactor/product-runtime-cleanup
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: node dev/tools/prepare-cleanup-transform.mjs
      - run: node dev/tools/apply-product-runtime-cleanup.mjs
      - run: node dev/tools/check-product-viewer.mjs
      - run: npm ci
      - name: Run full check and capture output
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-runtime-check-log
          path: check.log
          if-no-files-found: error
