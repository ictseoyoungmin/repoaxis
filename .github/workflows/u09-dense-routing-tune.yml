name: u09-dense-routing-tune
on:
  push:
    branches:
      - feat/u09-dense-graph-routing
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: node dev/tools/tune-u09-dense-routing.mjs
      - run: npm ci
      - run: npm run check
      - name: Commit tuned U09 routing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/repoaxis/viewer/viewer-3.js
          git diff --cached --quiet && exit 0
          git commit -m "U09: prefer clear simple Graph routes"
          git push origin HEAD:feat/u09-dense-graph-routing
