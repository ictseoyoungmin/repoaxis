<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repoaxis</title>
<link rel="stylesheet" href="/viewer-base.css">
<link rel="stylesheet" href="/viewer-surfaces.css">
</head>
<body>
<div class="boot" id="boot"><div class="boot-card"><span class="spin"></span><span>Reading Git + working tree…</span></div></div><div class="error" id="error" hidden></div>
<div class="app">
<header class="topbar"><div class="brand"><svg viewBox="0 0 150 36" aria-label="Repoaxis"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#aaa6ff"/><stop offset="1" stop-color="#625bff"/></linearGradient></defs><g transform="translate(0 3)"><path d="M7 6H20Q25 6 25 11V13.78Q25 16 22.78 16H7Q2 16 2 11Q2 6 7 6Z" fill="url(#lg)" transform="rotate(-43 13.5 11)"/><path d="M14 4Q19 4 19 9V24.78Q19 27 16.78 27H14Q9 27 9 22V9Q9 4 14 4Z" fill="url(#lg)" transform="rotate(-43 14 15.5)"/></g><text x="42" y="22" fill="#101828" font-size="20" font-weight="760">Repoaxis</text></svg></div><div class="repo-pill" id="repoPill"><span id="repoName" class="repo-name">Repository</span><span id="origin" class="origin">Git</span></div><div class="branch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 7.2v9.6M8.2 15c4.5 0 7.8-2.1 7.8-4.8"/></svg><span id="branch">—</span><span class="sep"></span></div><button class="commit" id="copyHead" title="Copy HEAD SHA"><code id="head">—</code><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="8" y="4" width="10" height="13" rx="2"/><path d="M6 8H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2"/></svg></button><div class="selection-context"><span class="sel-ico" id="selIcon"></span><span class="sel-copy"><span class="sel-name" id="selName">Repository</span><span class="sel-detail" id="selDetail">Canonical root</span></span><span class="sel-view" id="selView">Structure</span></div><div class="spacer"></div><label class="search-trigger" id="searchTrigger"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input placeholder="Search the repository…" readonly><span class="kbd">⌘K</span></label></header>
<div class="body"><aside class="rail"><button class="rail-item active" data-view="structure" aria-label="Structure"><span id="ri-structure"></span><span>Structure</span></button><button class="rail-item" data-view="dependencies" aria-label="Dependencies"><span id="ri-dependencies"></span><span>Dependencies</span></button><button class="rail-item" data-view="changes" aria-label="Changes"><span id="ri-changes"></span><span>Changes</span></button><button class="rail-item" data-view="graph" aria-label="Graph"><span id="ri-graph"></span><span>Graph</span></button><div class="rail-spacer"></div></aside>
<main class="workspace"><section class="main-card" id="mainCard"><div class="card-head"><span class="title-icon" id="titleIcon"></span><span class="card-title" id="cardTitle">Structure</span><span class="count" id="cardCount">0</span><span class="card-stats" id="cardStats"></span><span class="subtitle" id="subtitle"></span><div class="spacer"></div><div class="git-overlay" id="gitOverlay"><span>Git</span><button class="active" data-git="working">Working tree</button><button data-git="history">Last commit</button><code class="git-sha" id="gitSha" hidden>—</code></div><button class="tool-btn" id="fitBtn" title="Fit">Fit</button><button class="tool-btn" id="focusBtn" title="Focus">Focus</button><button class="tool-btn" id="filterBtn" title="Filter">Filter</button><div class="filter-pop" id="filterPop" hidden></div></div>
<div class="content" id="content"><div class="view-host"><section class="view canvas active" id="structureView"><div class="stage-toolbar"><span class="mode-label" id="structureMode">Whole repository · labels hidden</span><div class="breadcrumbs" id="breadcrumbs" hidden></div><button class="mini" id="wholeBtn" hidden>Whole topology</button><button class="mini" id="labelsBtn">Show labels</button></div><svg class="structure-svg" id="structureSvg"></svg><div class="legend"><span><i></i>containment</span><span>Git badge = overlay state</span></div></section><section class="view" id="dependenciesView"><div class="dep-shell" id="depShell"></div></section><section class="view changes-view" id="changesView"><div class="changes-shell" id="changesShell"></div></section><section class="view canvas" id="graphView"><div class="stage-toolbar"><span class="mode-label" id="graphScope">Whole repository · canonical file imports</span><button class="mini" id="graphNeighborhood">Focus neighborhood</button><button class="mini active" data-hop="1">1-hop</button><button class="mini" data-hop="2">2-hop</button></div><div class="tracebar impactbar" id="impactBar" hidden></div><div class="tracebar propagation" id="tracebar" hidden></div><svg class="graph-svg" id="graphSvg"></svg><div class="legend"><span><i></i>import</span><span><i style="background:#746df3"></i>Imported by</span><span><i style="background:#14a397"></i>Imports</span></div></section><div class="zoom" id="zoom"><button id="zoomOut" title="Zoom out" aria-label="Zoom out"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 12h14"/></svg></button><button id="zoomReset" title="Reset view" aria-label="Reset view"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4.5 11.2L12 5l7.5 6.2"/><path d="M7.5 10.8v8h9v-8"/></svg></button><button id="zoomIn" title="Zoom in" aria-label="Zoom in"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 12h14M12 5v14"/></svg></button></div></div><aside class="drawer" id="drawer"><div class="drawer-inner"><div class="drawer-head"><div class="entity-row"><div class="entity-icon" id="entityIcon"></div><div class="entity-main"><div class="entity-name" id="entityName">Repository</div><div class="entity-meta"><span id="entityType">Repository root</span><span>•</span><span id="entityPath">/</span></div></div><button class="drawer-close" id="drawerClose">×</button></div><div class="entity-actions" id="entityActions"></div></div><div class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="relations">Relations <span id="relCount"></span></button><button class="tab" data-tab="metrics">Metrics</button><button class="tab" data-tab="source">Source</button></div><div class="drawer-scroll" id="drawerBody"></div></div></aside></div></section></main></div></div>
<div class="search-overlay" id="searchOverlay"><div class="search-pop"><div class="search-head"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="searchInput" placeholder="Search files, folders, classes, functions…"><span class="kbd">ESC</span></div><div class="search-results" id="searchResults"></div></div></div><div class="toast" id="toast"></div>
<script src="/viewer-0.js"></script>
<script src="/viewer-1.js"></script>
<script src="/viewer-2.js"></script>
<script src="/viewer-3.js"></script>
<script src="/viewer-4.js"></script>
</body></html>
