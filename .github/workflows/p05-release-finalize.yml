name: p05-release-finalize

on:
  push:
    branches:
      - feat/p05-release-0.12.2
    paths:
      - dev/reports/p05-release-finalize-request.md

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/p05-release-0.12.2
      - name: Finalize changelog and public onboarding docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('CHANGELOG.md'); s=p.read_text()
          section='''## 0.12.2 — 2026-09-01\n\n- Hardened the human viewer after public-registry dogfooding exposed a Git-state projection gap.\n- Added a read-only **Changes** surface backed directly by `generated.git_changes`, including deleted paths that no longer have current filesystem nodes.\n- Structure badges now distinguish working-tree changes from staged changes instead of collapsing them into one generic modified badge.\n- Added `#structure`, `#dependencies`, `#changes`, and `#graph` deep links for the local viewer.\n- Verified the public npm first-run path in a clean external Git repository using `npx -y repoaxis@0.12.1`, covering CLI queries, refresh, durable annotations, index recreation, and live viewer capture.\n- Updated public onboarding examples to use non-interactive `npx -y repoaxis@latest` for agent-friendly first runs.\n\n'''
          if '## 0.12.2 — 2026-09-01' not in s:
              s=s.replace('# Changelog\n\n','# Changelog\n\n'+section,1)
          p.write_text(s)

          p=Path('README.md'); s=p.read_text()
          s=s.replace('npx repoaxis doctor\nnpx repoaxis build\nnpx repoaxis summary\nnpx repoaxis changed\nnpx repoaxis unreferenced\nnpx repoaxis view', 'npx -y repoaxis@latest doctor\nnpx -y repoaxis@latest build\nnpx -y repoaxis@latest summary\nnpx -y repoaxis@latest changed\nnpx -y repoaxis@latest unreferenced\nnpx -y repoaxis@latest view')
          s=s.replace('npx repoaxis find parseConfig\nnpx repoaxis context parseConfig\nnpx repoaxis why parseConfig', 'npx -y repoaxis@latest find parseConfig\nnpx -y repoaxis@latest context parseConfig\nnpx -y repoaxis@latest why parseConfig')
          s=s.replace('It shows the canonical folder/file/class/function tree, Git status and last-file commit context, stored annotations, repository-local imports and reverse imports, and a bounded dependency graph.', 'It shows the canonical folder/file/class/function tree, distinct working/staged Git badges, a complete Changes surface including deleted paths, last-file commit context, stored annotations, repository-local imports and reverse imports, and a bounded dependency graph.')
          p.write_text(s)

          p=Path('docs/installation.md'); s=p.read_text()
          s=s.replace('npx repoaxis doctor\nnpx repoaxis build\nnpx repoaxis summary', 'npx -y repoaxis@latest doctor\nnpx -y repoaxis@latest build\nnpx -y repoaxis@latest summary')
          p.write_text(s)

          p=Path('dev/reports/p05-registry-dogfood.md'); s=p.read_text()
          s=s.replace('Status: REVIEW','Status: CLOSED',1)
          s=s.replace('Close P05 after the hardening PR passes the full repository CI. A later public package release can re-run the same registry dogfood to capture the hardened `#changes` surface from npm.', 'P05 hardening passed full repository CI and merged in PR #21. Release 0.12.2 publishes that hardened viewer so a registry-only follow-up can capture the complete `#changes` surface from the public package.')
          p.write_text(s)
          PY
      - name: Self-clean and commit
        run: |
          rm -f .github/workflows/p05-release-finalize.yml dev/reports/p05-release-finalize-request.md
          git config user.name 'repoaxis-p05-bot'
          git config user.email '90033184+ictseoyoungmin@users.noreply.github.com'
          git add CHANGELOG.md README.md docs/installation.md dev/reports/p05-registry-dogfood.md .github/workflows/p05-release-finalize.yml dev/reports/p05-release-finalize-request.md
          git commit -m 'P05: finalize 0.12.2 public release notes and onboarding'
          git push origin HEAD:feat/p05-release-0.12.2
