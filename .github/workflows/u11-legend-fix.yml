name: u11-legend-fix
on:
  push:
    branches: [feat/u11-structure-git-aggregation]
    paths: [.github/workflows/u11-legend-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Align Structure Git legend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('skills/repoaxis/viewer/repoaxis.html')
          s=p.read_text()
          old='Git badge = overlay state'
          if old not in s:
              raise SystemExit('legend anchor missing')
          p.write_text(s.replace(old,'Git marks = overlay state'))
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit legend correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/repoaxis/viewer/repoaxis.html
          git commit -m "U11: align Structure Git legend with scope marks"
          git push origin HEAD:feat/u11-structure-git-aggregation
