name: v47-r00-assemble
on:
  push:
    branches:
      - feat/v47-r00-canonical-viewer-reset
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Verify source shape
        run: |
          test "$(wc -c < .v47-r00/chunk-00.b64)" -eq 5000
          test "$(wc -c < .v47-r00/chunk-01.b64)" -eq 5000
          test "$(wc -c < .v47-r00/chunk-02.b64)" -eq 5000
          test "$(wc -c < .v47-r00/gz-00d.b64)" -eq 5000
          test "$(wc -c < .v47-r00/gz-01.b64)" -eq 20000
          test "$(wc -c < .v47-r00/gz-02.b64)" -eq 20000
          test "$(wc -c < .v47-r00/gz-03.b64)" -eq 15000
          test "$(wc -c < .v47-r00/gz-04.b64)" -eq 264
      - name: Apply canonical reset
        run: |
          python -c "from pathlib import Path; p=Path('.v47-r00/apply.py'); s=p.read_text(); a=s.index('parts=['); b=s.index(chr(10)+'encoded=',a); line=\"parts=[ROOT/'.v47-r00/chunk-00.b64',ROOT/'.v47-r00/chunk-01.b64',ROOT/'.v47-r00/chunk-02.b64',ROOT/'.v47-r00/gz-00d.b64',ROOT/'.v47-r00/gz-01.b64',ROOT/'.v47-r00/gz-02.b64',ROOT/'.v47-r00/gz-03.b64',ROOT/'.v47-r00/gz-04.b64']\"; p.write_text(s[:a]+line+s[b:])"
          python .v47-r00/apply.py
          echo '5cbb82c3014d32e88a64860cc55fa6213813b353a98b6b3b151c7eef745a960d  skills/repoaxis/viewer/repoaxis.html' | sha256sum -c -
      - name: Validate reset
        run: |
          npm ci
          npm run check
          npm run release:dry-run
      - name: Commit canonical reset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'V47-R00: reset viewer to canonical single-file prototype'
          git push origin HEAD:feat/v47-r00-canonical-viewer-reset
