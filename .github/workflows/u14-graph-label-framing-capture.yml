name: u14-graph-label-framing-capture
on:
  push:
    branches: [feat/u14-graph-label-framing]
    paths: [.github/workflows/u14-graph-label-framing-capture.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node dev/tools/capture-u14-graph-label-framing.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: u14-graph-label-framing
          path: |
            u14-impact-framing-1600.png
            u14-impact-framing-1280.png
            u14-framing-metrics.json
            u14-graph-label-framing.html
# final run requires visible horizontal padding inside every Git badge
