name: u15-changes-checkbox-parity
on:
  push:
    branches: [feat/u15-changes-checkbox-parity]
    paths: [.github/workflows/u15-changes-checkbox-parity.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: node dev/tools/patch-u15-changes-checkbox-parity.mjs
      - run: npm run check
      - name: Commit product changes
        run: |
          git config user.name 'ictseoyoungmin'
          git config user.email '90033184+ictseoyoungmin@users.noreply.github.com'
          git add skills/repoaxis/viewer/viewer-2.js skills/repoaxis/viewer/viewer-surfaces.css dev/tests/integration/viewer-changes-interaction.test.mjs dev/tests/integration/viewer-changes-checkbox-parity.test.mjs
          git commit -m 'U15: match Changes checkbox prototype'
          git push origin HEAD:feat/u15-changes-checkbox-parity
