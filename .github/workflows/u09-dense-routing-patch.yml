name: u09-dense-routing-patch
on:
  push:
    branches:
      - feat/u09-dense-graph-routing
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: node dev/tools/run-u09-dense-routing-patch.mjs
      - run: npm ci
      - run: npm run check
      - name: Commit U09 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/repoaxis/viewer/viewer-3.js dev/tests/integration/viewer-graph-dense-routing.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "U09: harden dense Graph routing"
          git push origin HEAD:feat/u09-dense-graph-routing
