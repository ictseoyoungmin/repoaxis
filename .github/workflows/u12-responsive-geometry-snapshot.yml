name: u12-responsive-geometry-snapshot
on:
  push:
    branches: [feat/u12-responsive-geometry-reconciliation]
    paths: [.github/workflows/u12-responsive-geometry-snapshot.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node bin/repoaxis build
      - name: Start viewer
        run: |
          node bin/repoaxis view --no-open --port 4173 > /tmp/repoaxis-viewer.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/repoaxis-viewer.log
          exit 1
      - run: node bin/repoaxis snapshot --output u12-responsive-geometry.html
      - run: node dev/tools/capture-u12-responsive-geometry.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: u12-responsive-geometry
          path: |
            u12-structure-before.png
            u12-structure-drawer-open.png
            u12-dependencies-drawer-open.png
            u12-graph-drawer-open.png
            u12-graph-resized.png
            u12-responsive-geometry.html
          retention-days: 7
