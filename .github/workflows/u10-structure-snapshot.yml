name: u10-structure-snapshot
on:
  push:
    branches: [feat/u10-structure-direct-manipulation]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Build clean capture index
        run: |
          rm -f .github/workflows/u10-structure-snapshot.yml dev/tools/capture-u10-structure.mjs
          node bin/repoaxis build
      - name: Start viewer
        run: |
          node bin/repoaxis view --no-open --port 4173 > /tmp/repoaxis-viewer.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/repoaxis-viewer.log
          exit 1
      - run: node bin/repoaxis snapshot --output u10-structure-direct-manipulation.html
      - name: Restore capture helper
        run: git checkout HEAD -- dev/tools/capture-u10-structure.mjs
      - run: node dev/tools/capture-u10-structure.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: u10-structure-direct-manipulation
          path: |
            u10-structure-baseline.png
            u10-structure-after-first-click.png
            u10-structure-direct-manipulation.html
          retention-days: 7
