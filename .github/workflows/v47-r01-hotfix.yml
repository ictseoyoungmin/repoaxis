name: v47-r01-hotfix
on:
  push:
    branches:
      - feat/v47-r01-live-data-wiring
permissions:
  contents: write
jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: node dev/tools/v47-r01-hotfix.mjs
      - run: |
          npm ci
          npm run check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/repoaxis/viewer/repoaxis.html
          git commit -m 'V47-R01: fix live Inspector selector compatibility'
          git push origin HEAD:feat/v47-r01-live-data-wiring
