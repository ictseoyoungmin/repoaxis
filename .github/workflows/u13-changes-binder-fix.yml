name: u13-changes-binder-fix
on:
  push:
    branches: [feat/u13-changes-surface-hardening]
    paths: [.github/workflows/u13-changes-binder-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: node dev/tools/fix-u13-changes-binders.mjs
      - run: npm run check
      - name: Commit binder correction
        run: |
          git config user.name 'ictseoyoungmin'
          git config user.email '90033184+ictseoyoungmin@users.noreply.github.com'
          git add skills/repoaxis/viewer/viewer-2.js dev/tests/integration/viewer-changes-interaction.test.mjs
          git commit -m 'U13: restore multi-row Changes bindings'
          git push origin HEAD:feat/u13-changes-surface-hardening
