name: u07-graph-routing-patch

on:
  push:
    branches:
      - feat/u07-graph-routing-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node dev/tools/patch-u07-graph-routing.mjs
      - run: npm ci
      - run: npm run check
      - name: Commit U07 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/repoaxis/viewer/viewer-3.js skills/repoaxis/viewer/viewer-base.css dev/tests/integration/viewer-graph-routing.test.mjs
          git commit -m "U07: restore routed Graph geometry"
          git push origin HEAD:feat/u07-graph-routing-parity
