name: v47-r01-apply
on:
  push:
    branches:
      - feat/v47-r01-live-data-wiring
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Apply live adapter
        run: |
          node dev/tools/apply-v47-r01.mjs
          node -e "const fs=require('fs'),c=require('crypto'),s=fs.readFileSync('skills/repoaxis/viewer/repoaxis.html','utf8'),m=s.indexOf('<!-- V47-R01 LIVE DATA WIRING -->'); console.log('canonical_prefix_sha='+c.createHash('sha256').update(s.slice(0,m)).digest('hex'))"
      - name: Validate
        run: |
          npm ci
          npm run check
          npm run release:dry-run
      - name: Commit generated wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/repoaxis/viewer/repoaxis.html dev/tests/integration/viewer.test.mjs dev/visuals/v47-r01-live-data-wiring.snapshot.md
          git commit -m 'V47-R01: wire canonical viewer to live Repoaxis data'
          git push origin HEAD:feat/v47-r01-live-data-wiring
