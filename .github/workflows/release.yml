name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "dev/reports/p04-release-request.json"

permissions:
  contents: write
  id-token: write

concurrency:
  group: repoaxis-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ictseoyoungmin/repoaxis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
            REQUEST="$(node -p "require('./dev/reports/p04-release-request.json').tag")"
            if [[ "$REQUEST" != "$TAG" ]]; then
              echo "Release request $REQUEST does not match package version $TAG" >&2
              exit 1
            fi
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists; bootstrap request is no longer valid." >&2
              exit 1
            fi
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Require tag commit on main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - run: npm ci
      - run: npm run check

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node dev/tools/prepare-release.mjs --tag "$RELEASE_TAG" --out dist/release

      - name: Publish npm package with trusted publishing
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "${NAME}@${VERSION}" version --json 2>/dev/null || true)"
          if [[ "$PUBLISHED" == "\"${VERSION}\"" || "$PUBLISHED" == "$VERSION" ]]; then
            echo "${NAME}@${VERSION} is already published; skipping npm publish."
          elif [[ -n "$PUBLISHED" && "$PUBLISHED" != "null" ]]; then
            echo "Unexpected npm registry response for ${NAME}@${VERSION}: $PUBLISHED" >&2
            exit 1
          else
            npm publish "dist/release/repoaxis-${VERSION}.tgz" --access public
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/release/repoaxis-*.tgz \
              dist/release/repoaxis-*.tgz.sha256 \
              dist/release/release-manifest.json \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/release/repoaxis-*.tgz \
              dist/release/repoaxis-*.tgz.sha256 \
              dist/release/release-manifest.json \
              --verify-tag \
              --title "Repoaxis $RELEASE_TAG" \
              --notes-file dist/release/release-notes.md
          fi
