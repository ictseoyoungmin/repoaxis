name: u08-graph-spacing-patch

on:
  push:
    branches:
      - feat/u08-graph-spacing-first-world

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node dev/tools/patch-u08-graph-spacing.mjs
      - run: npm ci
      - run: npm run check
      - name: Commit U08 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/repoaxis/viewer/viewer-0.js skills/repoaxis/viewer/viewer-3.js dev/tests/integration/viewer-graph-spacing.test.mjs
          git commit -m "U08: keep Graph at readable world scale"
          git push origin HEAD:feat/u08-graph-spacing-first-world
