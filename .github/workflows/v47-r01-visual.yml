name: v47-r01-visual
on:
  push:
    branches:
      - feat/v47-r01-live-data-wiring
permissions:
  contents: read
jobs:
  visual:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node dev/tools/v47-r01-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v47-r01-visual
          path: artifacts/v47-r01
