name: u13-changes-patch
on:
  push:
    branches: [feat/u13-changes-surface-hardening]
    paths: [.github/workflows/u13-changes-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: node dev/tools/patch-u13-changes-interaction.mjs
      - run: npm run check
      - name: Commit product patch
        run: |
          git config user.name 'ictseoyoungmin'
          git config user.email '90033184+ictseoyoungmin@users.noreply.github.com'
          git add skills/repoaxis/viewer/viewer-2.js skills/repoaxis/viewer/viewer-surfaces.css dev/tests/integration/viewer-changes-interaction.test.mjs
          git commit -m 'U13: harden Changes direct manipulation'
          git push origin HEAD:feat/u13-changes-surface-hardening
