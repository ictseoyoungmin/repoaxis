name: vendor-acorn-once

on:
  push:
    branches: [feat/s09-refresh-automation]
    paths:
      - .github/workflows/vendor-acorn-once.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/s09-refresh-automation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vendor official Acorn 8.15.0 ESM build
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack acorn@8.15.0 --silent)"
          tmpdir="$(mktemp -d)"
          tar -xzf "$tarball" -C "$tmpdir" package/dist/acorn.mjs
          mv "$tmpdir/package/dist/acorn.mjs" skills/repoaxis/lib/vendor/acorn-8.15.0.mjs
          rm -f "$tarball"
          git rm skills/repoaxis/lib/vendor/acorn-8.15.0.mjs.gz
          git rm .github/workflows/vendor-acorn-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/repoaxis/lib/vendor/acorn-8.15.0.mjs
          git commit -m "Restore Acorn 8.15.0 plain ESM vendor artifact"
          git push origin HEAD:feat/s09-refresh-automation
