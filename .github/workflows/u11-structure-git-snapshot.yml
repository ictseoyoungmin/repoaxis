name: u11-structure-git-snapshot
on:
  push:
    branches: [feat/u11-structure-git-aggregation]
    paths: [.github/workflows/u11-structure-git-snapshot.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Create actual Repoaxis dirty-state fixture
        run: |
          printf '\n/* U11 staged fixture */\n' >> skills/repoaxis/viewer/viewer-1.js
          git add skills/repoaxis/viewer/viewer-1.js
          printf '\n/* U11 working-after-stage fixture */\n' >> skills/repoaxis/viewer/viewer-1.js
          printf '\n/* U11 working fixture */\n' >> skills/repoaxis/viewer/viewer-base.css
          rm dev/tests/integration/viewer-structure-interaction.test.mjs
          git add -u dev/tests/integration/viewer-structure-interaction.test.mjs
          git status --short
      - run: node bin/repoaxis build
      - name: Start viewer
        run: |
          node bin/repoaxis view --no-open --port 4173 > /tmp/repoaxis-viewer.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/repoaxis-viewer.log
          exit 1
      - run: node bin/repoaxis snapshot --output u11-structure-git-aggregation.html
      - run: node dev/tools/capture-u11-structure-git.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: u11-structure-git-aggregation
          path: |
            u11-structure-git-overview.png
            u11-structure-git-inspector.png
            u11-structure-git-aggregation.html
          retention-days: 7
