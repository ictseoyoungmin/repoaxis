name: u17-1-visual-qa

on:
  push:
    branches: [feat/u17-1-visual-release-prep]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node dev/tools/capture-u17-1-cross-view.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: u17-1-cross-view-arrival
          path: dev/visuals/u17-1-output/
          if-no-files-found: error
