name: u10-structure-target-fix
on:
  push:
    branches: [feat/u10-structure-direct-manipulation]
    paths: [.github/workflows/u10-structure-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Make the visible macro unit the clickable macro unit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const viewerPath='skills/repoaxis/viewer/viewer-1.js';
          let viewer=fs.readFileSync(viewerPath,'utf8');
          const before=`<circle class="macro-dot" cx="\${x}" cy="\${y}"`;
          const after=`<rect class="macro-target" x="\${x-22}" y="\${y-17}" width="184" height="34" rx="13" fill="transparent"/><circle class="macro-dot" cx="\${x}" cy="\${y}"`;
          if(!viewer.includes('class="macro-target"')){
            if(!viewer.includes(before))throw new Error('Missing macro dot patch anchor');
            viewer=viewer.replace(before,after);
            fs.writeFileSync(viewerPath,viewer);
          }
          const testPath='dev/tests/integration/viewer-structure-interaction.test.mjs';
          let test=fs.readFileSync(testPath,'utf8');
          if(!test.includes("assert.match(html,/class=\"macro-target\"/)")){
            const anchor='  assert.match(html,/class="macro-label"/);';
            if(!test.includes(anchor))throw new Error('Missing interaction test anchor');
            test=test.replace(anchor,anchor+'\n  assert.match(html,/class="macro-target"/);');
            fs.writeFileSync(testPath,test);
          }
          NODE
      - run: npm ci
      - run: npm run check
      - name: Commit U10 Structure acquisition correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/repoaxis/viewer/viewer-1.js dev/tests/integration/viewer-structure-interaction.test.mjs
          git commit -m "U10: align Structure macro visuals and hit targets"
          git push origin HEAD:feat/u10-structure-direct-manipulation
