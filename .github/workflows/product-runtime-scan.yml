name: product-runtime-scan
on:
  push:
    branches:
      - refactor/product-runtime-cleanup
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node dev/tools/product-runtime-scan.mjs
